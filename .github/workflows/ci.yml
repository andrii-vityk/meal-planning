name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On pull requests, check out the branch itself (not the merge
          # commit) so the lockfile step below can push to it.
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Commits package-lock.json back to the branch the first time it is
      # generated. Pushes made with GITHUB_TOKEN do not trigger new runs.
      - name: Commit lockfile if missing
        if: github.event_name == 'pull_request'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json generated by CI"
          git push origin "HEAD:$SOURCE_BRANCH"

      # The built page is published to a separate orphan branch
      # (build/<source branch>) so it can be fetched with plain git.
      - name: Publish built page to build branch
        run: |
          cp dist/artifact.html "$RUNNER_TEMP/artifact.html"
          cd "$RUNNER_TEMP"
          rm -rf build-branch && mkdir build-branch && cd build-branch
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/artifact.html" .
          git add artifact.html
          git commit -qm "build: $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/build/$SOURCE_BRANCH"
